model:
  name: "BAAI/bge-base-en-v1.5"
  normalize: true
  query_prefix: true
  query_prefix_text: "Represent this sentence for searching relevant passages: "
  device: "cpu"
  batch_size: 32
  cache_path: "data/cache/embeddings.npz"

corpus:
  raw_dir: "data/raw"
  pages:
    - "Diabetes"
    - "Type 1 diabetes"
    - "Type 2 diabetes"
  strip_sections:
    - "References"
    - "External links"
    - "See also"
    - "Further reading"
    - "Notes"
    - "Works cited"
  keep_headings: true
  chunk_size_words: 150
  overlap_words: 0
  min_chunk_words: 30

retrieval:
  k: 3
  pool_multiplier: 5
  tie_break: "chunk_id_asc"

gate:
  tau: 0.80
  averaging: "mean"

repair:
  delta: 0.834
  multiway_rule: "iterative_worst_pair"
  backfill_check: "pairwise_delta"
  exhaustion_fallback: "relax"

mmr:
  lambda: 0.7
